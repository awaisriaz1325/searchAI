name: nightly-eval
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: searchai
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/searchai
      MODEL_CACHE: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-e5small-qwen05b-bgererankbase-v1
      # Extraction re-runs only when the model or prompt changed (the CLI skips rows with a matching promptHash).
      - run: npm run extract
      - run: npm run eval
      - name: Commit results
        if: always()
        run: |
          git config user.name "searchai-nightly"
          git config user.email "actions@users.noreply.github.com"
          git add results/nightly results/eval-latest.json results/extraction-1k.json data/facts-extracted-1k.jsonl
          git diff --cached --quiet || git commit -m "chore: nightly eval $(date -u +%F)"
          git push
